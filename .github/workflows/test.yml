name: tests

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: C module regression
        run: node test-c-module.js
      - name: Acceptance and module tests
        run: node tests/test-acceptance.js
